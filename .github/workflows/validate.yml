name: Validate master skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill structure and links
        run: python scripts/validate_repository.py

      - name: Test skill helper
        run: python -m unittest discover -s skills/senior-software-engineer/scripts -p 'test_*.py' -v

      - name: Test repository tooling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build distributable ZIP
        run: python scripts/package_skill.py --output-dir dist

      - name: Upload skill package
        uses: actions/upload-artifact@v4
        with:
          name: senior-software-engineer-skill
          path: dist/senior-software-engineer-v*.zip
          if-no-files-found: error
          retention-days: 30
