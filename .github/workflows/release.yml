name: Release master skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish skill package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill structure and links
        run: python scripts/validate_repository.py

      - name: Run tests
        run: |
          python -m unittest discover -s skills/senior-software-engineer/scripts -p 'test_*.py' -v
          python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify tag matches skill version and package
        id: package
        shell: bash
        run: |
          VERSION="$(python scripts/package_skill.py --version-only)"
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v$VERSION"
          python scripts/package_skill.py --output-dir dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/senior-software-engineer-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "Senior Software Engineer ${{ steps.package.outputs.version }}" \
            --generate-notes
